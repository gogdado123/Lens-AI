<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lens AI: บันทึกภาพเข้าชุดข้อมูล</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1f23; --muted:#5b6670; --line:#d5dbe1; --accent:#1559c1; --warn-bg:#fff4e0; --warn-fg:#7a4a00; --bad-bg:#fde8e8; --bad-fg:#8a1c1c; --ok-bg:#e6f4ea; --ok-fg:#1c5c2e; --field:#f5f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16191d; --fg:#e8ebee; --muted:#9aa5b0; --line:#343b43; --accent:#7fb0ff; --warn-bg:#3a2e12; --warn-fg:#f0cf8a; --bad-bg:#3d1b1b; --bad-fg:#f5b5b5; --ok-bg:#16301f; --ok-fg:#9fdcb0; --field:#1f242a; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px 18px 24px; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI","Noto Sans Thai",system-ui,sans-serif; }
  h1 { font-size:17px; margin:0 0 12px; }
  .row { display:flex; gap:12px; align-items:flex-start; }
  #thumb { width:120px; height:120px; object-fit:contain; background:var(--field); border:1px solid var(--line); border-radius:4px; flex:none; }
  #meta { color:var(--muted); font-size:13px; word-break:break-word; }
  #meta b { color:var(--fg); font-weight:600; }
  fieldset { border:0; padding:0; margin:16px 0 0; }
  legend { font-weight:600; padding:0; margin-bottom:6px; }
  label.opt { display:flex; gap:8px; padding:5px 8px; border-radius:4px; cursor:pointer; align-items:flex-start; }
  label.opt:hover { background:var(--field); }
  label.opt small { color:var(--muted); display:block; }
  select, textarea, input[type=text] { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px; background:var(--field); color:var(--fg); font:inherit; }
  textarea { min-height:56px; resize:vertical; }
  .notice { padding:8px 10px; border-radius:4px; margin-top:12px; font-size:13px; }
  .warn { background:var(--warn-bg); color:var(--warn-fg); }
  .bad { background:var(--bad-bg); color:var(--bad-fg); }
  .ok { background:var(--ok-bg); color:var(--ok-fg); }
  #srcHint { color:var(--muted); font-size:12.5px; margin-top:4px; min-height:18px; }
  .actions { display:flex; gap:8px; margin-top:18px; }
  button { font:inherit; padding:8px 16px; border-radius:4px; border:1px solid var(--line); background:var(--field); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  @media (prefers-color-scheme: dark) { button.primary { color:#0b1a33; } }
  button:disabled { opacity:.5; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>บันทึกภาพเข้าชุดข้อมูล</h1>

<div class="row">
  <img id="thumb" alt="ตัวอย่างภาพ">
  <div id="meta">กำลังโหลดภาพ…</div>
</div>

<div id="blocked" class="notice bad hidden"></div>
<div id="fetchFail" class="notice warn hidden"></div>

<form id="form" autocomplete="off">
  <fieldset>
    <legend>ภาพนี้จริงๆ แล้วเป็นอะไร</legend>
    <label class="opt"><input type="radio" name="label" value="real_photo"><span>ภาพถ่ายจริง</span></label>
    <label class="opt"><input type="radio" name="label" value="real_retouched"><span>ภาพถ่ายจริงที่รีทัช / แสงสตูดิโอ / ผ่านแอปแต่งภาพ</span></label>
    <label class="opt"><input type="radio" name="label" value="human_art_meme"><span>ภาพวาด มีม หรือกราฟิกที่คนทำ (ไม่ใช่ AI)</span></label>
    <label class="opt"><input type="radio" name="label" value="ai_full"><span>AI สร้างทั้งใบ</span></label>
    <label class="opt"><input type="radio" name="label" value="ai_faceswap"><span>สลับใบหน้า / ใส่หน้าคนอื่นด้วย AI</span></label>
    <label class="opt"><input type="radio" name="label" value="ai_partial_edit"><span>ภาพจริงที่ AI แก้เฉพาะบางส่วน</span></label>
    <label class="opt"><input type="radio" name="label" value="unsure"><span>ยังไม่แน่ใจ<small>เก็บไว้ดูเฉยๆ ไม่ใช้เทรนหรือวัดผล</small></span></label>
  </fieldset>

  <fieldset>
    <legend>รู้ได้ยังไง (ที่มาของป้าย)</legend>
    <select id="source" required>
      <option value="">— เลือก —</option>
      <option value="self_made">ฉันถ่ายเอง หรือสร้างด้วยเครื่องมือ AI เอง (รู้ว่าใช้อะไร)</option>
      <option value="content_credentials">Content Credentials ยืนยัน</option>
      <option value="press_attributed">สำนักข่าว / ช่างภาพระบุชัดเจน</option>
      <option value="creator_declared_ai">ผู้สร้างประกาศเองว่าเป็นภาพ AI</option>
      <option value="reverse_search_original">ค้นภาพย้อนกลับแล้วเจอต้นฉบับ</option>
      <option value="guess">แค่ดูด้วยตา / เดาเอง</option>
    </select>
    <div id="srcHint"></div>
  </fieldset>

  <fieldset>
    <legend>หมายเหตุ (ไม่บังคับ)</legend>
    <textarea id="note" placeholder="เช่น เครื่องมือที่ใช้สร้าง ลิงก์ต้นฉบับ หรือสิ่งที่ผิดปกติ"></textarea>
  </fieldset>

  <fieldset>
    <legend>ชื่อผู้บันทึก</legend>
    <input type="text" id="reporter" placeholder="ชื่อเล่นสั้นๆ" maxlength="30">
  </fieldset>

  <div class="notice warn">ภาพอาจมีใบหน้าของบุคคลจริง เก็บเฉพาะภาพที่เปิดดูได้สาธารณะ ใช้ในโปรเจกต์ของกลุ่มนี้เท่านั้น ห้ามเอาไปเผยแพร่ต่อ</div>

  <div class="actions">
    <button type="submit" class="primary" id="saveBtn">บันทึก</button>
    <button type="button" id="cancelBtn">ยกเลิก</button>
  </div>
  <div id="status" class="notice hidden" role="status"></div>
</form>

<script src="report.js"></script>
</body>
</html>
